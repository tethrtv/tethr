<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>{{.Title}}</title>
<style>
  body { margin: 0; padding: 0; }
  a { color: inherit; }
  @media (prefers-color-scheme: dark) {
    body, .page, .card { background: #1a1916 !important; }
    .ink { color: #edece5 !important; }
    .quiet { color: #aeaca1 !important; }
    .faint { color: #7c7a71 !important; }
    .rule { border-color: #edece5 !important; }
    .card { border-color: #edece5 !important; }
  }
  @media (max-width: 520px) {
    .pad { padding-left: 20px !important; padding-right: 20px !important; }
  }
</style>
</head>
<body style="margin:0;padding:0;background:#fbfbf8;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;">{{.Preview}}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="page" style="background:#fbfbf8;">
  <tr>
    <td align="center" style="padding:32px 12px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:520px;">
        <tr>
          <td class="rule" style="padding:0 0 12px 0;border-bottom:2px solid #141412;font-family:'Archivo','Helvetica Neue',Helvetica,Arial,sans-serif;">
            <img src="{{.AppURL}}/email-mark.png" width="24" height="24" alt="" style="display:inline-block;vertical-align:middle;border:0;">
            <span class="ink" style="font-size:22px;font-weight:800;letter-spacing:-0.5px;color:#141412;vertical-align:middle;padding-left:6px;">tethr</span>
          </td>
        </tr>
        <tr>
          <td style="padding:32px 0 0 0;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="card" style="border:1.5px solid #141412;border-radius:2px;background:#fbfbf8;">
              <tr>
                <td class="pad" style="padding:28px 30px 30px 30px;font-family:'Archivo','Helvetica Neue',Helvetica,Arial,sans-serif;">
                  {{if .Image}}<img src="{{.AppURL}}/{{.Image}}" width="200" height="156" alt="{{.ImageAlt}}" style="display:block;width:200px;height:auto;margin:0 0 18px 0;border:0;border-radius:2px;">{{end}}
                  <h1 class="ink" style="margin:0 0 14px 0;font-size:28px;line-height:1.15;font-weight:800;color:#141412;">{{.Title}}</h1>
                  <p class="quiet" style="margin:0 0 24px 0;font-size:17px;line-height:1.5;color:#53534c;">{{.Lead}}</p>
                  <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                    <tr>
                      <td style="border-radius:4px;background:#d4fa3c;border:1.5px solid #141412;">
                        <a href="{{.Link}}" style="display:inline-block;padding:13px 24px;font-family:'Archivo','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:16px;font-weight:700;color:#141412;text-decoration:none;">{{.Button}}</a>
                      </td>
                    </tr>
                  </table>
                  <p class="faint" style="margin:24px 0 0 0;font-size:14px;line-height:1.5;color:#85857d;">{{.Note}}</p>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="padding:20px 0 0 0;font-family:'Archivo','Helvetica Neue',Helvetica,Arial,sans-serif;">
            <p class="faint" style="margin:0;font-size:13px;line-height:1.5;color:#85857d;">{{.Footer}}</p>
            <p class="faint" style="margin:8px 0 0 0;font-size:13px;line-height:1.5;color:#85857d;">Tethr, <a href="https://tethr.tv" style="color:#85857d;">tethr.tv</a></p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
