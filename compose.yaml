services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: tethr
      POSTGRES_PASSWORD: tethr
      POSTGRES_DB: tethr
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - postgres:/var/lib/postgresql

  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - 127.0.0.1:1025:1025
      - 127.0.0.1:8025:8025

volumes:
  postgres:
