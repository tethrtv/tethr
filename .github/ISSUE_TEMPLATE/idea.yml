name: An idea
description: Something Tethr should do, or do differently.
labels: [enhancement]
body:
  - type: dropdown
    id: area
    attributes:
      label: Which part of Tethr?
      options:
        - The website
        - Lists
        - Imports from other trackers
        - Media servers or other apps
        - The API
        - The Trakt-compatible API
        - Emails
        - Skip markers
        - Titles, IDs or search
        - Running my own Tethr
        - Not sure
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What you'd like
      description: What you want to be able to do, and why. If it's for an app or service you use, say which.
    validations:
      required: true
