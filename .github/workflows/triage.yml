name: triage

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  issues:
    types: [opened]

permissions: {}

jobs:
  label:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v7

  area:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: github/issue-labeler@v3.5
        with:
          configuration-path: .github/issue-labeler.yml
          enable-versioned-regex: 0

  welcome-issue:
    if: >-
      github.event_name == 'issues' && github.event.sender.type != 'Bot' &&
      !contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/first-interaction@v3
        with:
          issue_message: Thanks for opening your first issue on Tethr. Someone will take a look soon. If you'd like to work on it yourself, [CONTRIBUTING.md](https://github.com/tethrtv/tethr/blob/main/CONTRIBUTING.md) explains how.
          pr_message: Thanks for your first pull request to Tethr.

  # first-interaction misjudges first pull requests, so this goes by GitHub's own author association instead.
  welcome-pr:
    if: >-
      github.event_name == 'pull_request_target' && github.event.action == 'opened' &&
      github.event.sender.type != 'Bot' &&
      contains(fromJSON('["FIRST_TIME_CONTRIBUTOR", "FIRST_TIMER"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - run: gh pr comment "$PR" --repo "$REPO" --body "$MESSAGE"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          MESSAGE: Thanks for your first pull request to Tethr. The checks run once a maintainer approves them, and someone will review it after that. [CONTRIBUTING.md](https://github.com/tethrtv/tethr/blob/main/CONTRIBUTING.md) explains how to run most of them yourself.
